version: "2"

run:
  timeout: 5m
  tests: true
  relative-path-mode: cfg

linters:
  default: standard
  enable:
    - revive
  exclusions:
    generated: strict
    presets: []
    paths:
      - '(^|/)generate/'
      - '\.pb\.go$'
  settings:
    revive:
      rules:
        - name: exported
        - name: var-naming

formatters:
  enable:
    - gofmt
  exclusions:
    generated: strict
    paths:
      - '(^|/)generate/'
      - '\.pb\.go$'

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
