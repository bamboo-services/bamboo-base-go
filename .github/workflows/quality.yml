name: Quality checks

on:
  pull_request:
  push:
    branches: [master, feature-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documents:
    name: Markdown and Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: pnpm/action-setup@v4
      - name: Install pinned documentation tools
        run: pnpm install --frozen-lockfile
      - name: Check documentation
        run: make lint-docs

  go:
    name: Go quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.11"
          cache-dependency-path: "**/go.sum"
      - uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version
          install-only: true
      - name: Check all regular modules (lint & format)
        run: make lint-go
      - name: Vet all 14 v2 modules
        run: make vet
      - name: Test all 14 v2 modules
        run: make test
      - name: Test race on all 14 v2 modules
        run: make race
      - name: Install protobuf tools to private bin
        run: |
          BIN_DIR="${RUNNER_TEMP}/bin"
          mkdir -p "${BIN_DIR}"
          curl -sSLf "https://github.com/bufbuild/buf/releases/download/v1.73.0/buf-$(uname -s)-$(uname -m)" -o "${BIN_DIR}/buf"
          chmod +x "${BIN_DIR}/buf"
          (cd "${RUNNER_TEMP}" && GOWORK=off GOBIN="${BIN_DIR}" go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11)
          echo "${BIN_DIR}" >> "${GITHUB_PATH}"
      - name: Check protobuf generated code consistency
        run: make proto-check
      - name: Verify consumer examples and README quickstart
        run: make check-examples
